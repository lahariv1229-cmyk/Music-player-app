<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #241726;
    --panel: #2f1d33;
    --panel-edge: #3c2542;
    --accent: #f2c14e;
    --accent-soft: #6b4370;
    --text: #f4ecec;
    --text-dim: #b7a3bb;
    --track: #442b49;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:'Manrope', sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #37223c 0%, transparent 50%),
      radial-gradient(circle at 100% 100%, #2c1a30 0%, transparent 55%),
      var(--bg);
    color:var(--text);
  }
  .player{
    width:360px;
    max-width:100%;
    background:linear-gradient(165deg, var(--panel-edge), var(--panel));
    border-radius:26px;
    padding:26px;
    box-shadow:0 30px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }
  .top-label{
    font-size:11px;
    letter-spacing:.08em;
    color:var(--text-dim);
    font-family:'Manrope';
  }
  .top-count{
    font-size:11px;
    color:var(--text-dim);
  }
  .art-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:22px;
  }
  .disc{
    width:190px;
    height:190px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, var(--panel) 0 14px, transparent 15px),
      repeating-radial-gradient(circle at 50% 50%, #1a0f1c 0px, #1a0f1c 2px, #241429 2px, #241429 9px);
    box-shadow:0 12px 30px rgba(0,0,0,.5), inset 0 0 0 6px #17101a;
    position:relative;
    animation: spin 9s linear infinite;
    animation-play-state: paused;
  }
  .disc.spinning{ animation-play-state: running; }
  .disc::after{
    content:'';
    position:absolute;
    inset:0;
    margin:auto;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--accent);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .meta{ text-align:center; margin-bottom:18px; }
  .title{
    font-family:'Fraunces', serif;
    font-size:23px;
    font-weight:700;
    margin:0 0 4px;
    line-height:1.2;
  }
  .artist{
    font-size:13px;
    color:var(--text-dim);
    margin:0;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .time{
    font-size:11px;
    color:var(--text-dim);
    font-variant-numeric: tabular-nums;
    width:34px;
  }
  .time.right{ text-align:right; }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:4px;
    border-radius:4px;
    background:var(--track);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    box-shadow:0 0 0 3px rgba(242,193,78,.18);
  }
  input[type="range"]::-moz-range-thumb{
    width:13px; height:13px;
    border:none;
    border-radius:50%;
    background:var(--accent);
    cursor:pointer;
  }
  #seek{ background: linear-gradient(to right, var(--accent) 0%, var(--track) 0%); }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin:20px 0 18px;
  }
  .ctrl-btn{
    background:none;
    border:none;
    color:var(--text);
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .1s ease, color .15s ease;
  }
  .ctrl-btn:hover{ color:var(--accent); }
  .ctrl-btn:active{ transform:scale(.92); }
  .ctrl-btn.small svg{ width:20px; height:20px; }
  .play-btn{
    width:56px; height:56px;
    border-radius:50%;
    background:var(--accent);
    color:#2a1a05;
    box-shadow:0 8px 18px rgba(242,193,78,.25);
  }
  .play-btn:hover{ color:#2a1a05; }
  .play-btn svg{ width:22px; height:22px; }

  .bottom-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .bottom-row svg{ width:15px; height:15px; flex-shrink:0; color:var(--text-dim); }
  #volume{ flex:1; }
  #volume{ background: linear-gradient(to right, var(--accent) 70%, var(--track) 70%); }

  .toggles{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:16px;
  }
  .toggle{
    background:none;
    border:none;
    font-size:11px;
    letter-spacing:.03em;
    color:var(--text-dim);
    cursor:pointer;
    padding:6px 12px;
    border-radius:20px;
    transition:background .15s ease, color .15s ease;
  }
  .toggle.active{
    background:var(--accent-soft);
    color:var(--text);
  }

  .playlist{
    border-top:1px solid rgba(255,255,255,.07);
    padding-top:12px;
    max-height:150px;
    overflow-y:auto;
  }
  .track-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 6px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
  }
  .track-row:hover{ background:rgba(255,255,255,.04); }
  .track-row.playing{ background:rgba(242,193,78,.1); color:var(--accent); }
  .track-name{ display:flex; align-items:center; gap:8px; }
  .track-num{ color:var(--text-dim); font-variant-numeric: tabular-nums; font-size:12px; width:14px; }
  .track-dur{ color:var(--text-dim); font-size:12px; font-variant-numeric: tabular-nums; }
  .track-row.playing .track-dur{ color:var(--accent); }

  .playlist::-webkit-scrollbar{ width:5px; }
  .playlist::-webkit-scrollbar-thumb{ background:var(--track); border-radius:4px; }

  @media (prefers-reduced-motion: reduce){
    .disc{ animation:none; }
  }
</style>
</head>
<body>

<div class="player">
  <div class="top-row">
    <span class="top-label">NOW PLAYING</span>
    <span class="top-count" id="trackCount">1 / 4</span>
  </div>

  <div class="art-wrap">
    <div class="disc" id="disc"></div>
  </div>

  <div class="meta">
    <p class="title" id="titleText">Daylight Fade</p>
    <p class="artist" id="artistText">Mira Holt</p>
  </div>

  <div class="progress-row">
    <span class="time" id="curTime">0:00</span>
    <input type="range" id="seek" min="0" max="100" value="0">
    <span class="time right" id="durTime">0:00</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn small" id="prevBtn" title="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
    </button>
    <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn small" id="nextBtn" title="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
  </div>

  <div class="bottom-row">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
    <input type="range" id="volume" min="0" max="100" value="70">
  </div>

  <div class="toggles">
    <button class="toggle" id="shuffleBtn">Shuffle</button>
    <button class="toggle active" id="autoplayBtn">Autoplay</button>
    <button class="toggle" id="repeatBtn">Repeat</button>
  </div>

  <div class="playlist" id="playlist"></div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  const tracks = [
    { title:"Daylight Fade", artist:"Mira Holt", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
    { title:"Low Tide Blue", artist:"Rowan Pierce", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
    { title:"Static Bloom", artist:"Ines & the Coast", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
    { title:"Glass Corridor", artist:"Mira Holt", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
  ];

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const seek = document.getElementById('seek');
  const volume = document.getElementById('volume');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const titleText = document.getElementById('titleText');
  const artistText = document.getElementById('artistText');
  const disc = document.getElementById('disc');
  const trackCount = document.getElementById('trackCount');
  const playlistEl = document.getElementById('playlist');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const autoplayBtn = document.getElementById('autoplayBtn');
  const repeatBtn = document.getElementById('repeatBtn');

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

  let current = 0;
  let isPlaying = false;
  let shuffle = false;
  let autoplay = true;
  let repeat = false;

  function fmt(s){
    if (!isFinite(s) || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function renderPlaylist(){
    playlistEl.innerHTML = '';
    tracks.forEach((t, i)=>{
      const row = document.createElement('div');
      row.className = 'track-row' + (i === current ? ' playing' : '');
      row.innerHTML = `
        <span class="track-name"><span class="track-num">${i+1}</span>${t.title} — ${t.artist}</span>
        <span class="track-dur" data-dur="${i}">--:--</span>`;
      row.addEventListener('click', ()=> loadTrack(i, true));
      playlistEl.appendChild(row);
    });
  }

  function loadTrack(i, autoplayNow){
    current = i;
    const t = tracks[i];
    audio.src = t.src;
    titleText.textContent = t.title;
    artistText.textContent = t.artist;
    trackCount.textContent = `${i+1} / ${tracks.length}`;
    renderPlaylist();
    seek.value = 0;
    seek.style.background = `linear-gradient(to right, var(--accent) 0%, var(--track) 0%)`;
    curTime.textContent = '0:00';
    if (autoplayNow) play(); else pause();
  }

  function play(){
    audio.play().catch(()=>{});
    isPlaying = true;
    playIcon.outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${ICON_PAUSE}</svg>`;
    disc.classList.add('spinning');
    reattachPlayIcon();
  }
  function pause(){
    audio.pause();
    isPlaying = false;
    document.getElementById('playIcon').outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${ICON_PLAY}</svg>`;
    disc.classList.remove('spinning');
  }
  function reattachPlayIcon(){ /* icon element replaced via outerHTML above; nothing else needed */ }

  function toggleplay(){ isPlaying ? pause() : play(); }

  function next(){
    let i;
    if (shuffle){
      do { i = Math.floor(Math.random()*tracks.length); } while (i === current && tracks.length > 1);
    } else {
      i = (current + 1) % tracks.length;
    }
    loadTrack(i, true);
  }
  function prevTrack(){
    if (audio.currentTime > 3){ audio.currentTime = 0; return; }
    const i = (current - 1 + tracks.length) % tracks.length;
    loadTrack(i, true);
  }

  playBtn.addEventListener('click', toggleplay);
  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prevTrack);

  audio.addEventListener('timeupdate', ()=>{
    if (audio.duration){
      const pct = (audio.currentTime / audio.duration) * 100;
      seek.value = pct;
      seek.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--track) ${pct}%)`;
      curTime.textContent = fmt(audio.currentTime);
    }
  });
  audio.addEventListener('loadedmetadata', ()=>{
    durTime.textContent = fmt(audio.duration);
    const durEl = document.querySelector(`[data-dur="${current}"]`);
    if (durEl) durEl.textContent = fmt(audio.duration);
  });
  audio.addEventListener('ended', ()=>{
    if (repeat){ audio.currentTime = 0; play(); }
    else if (autoplay){ next(); }
    else { pause(); }
  });

  seek.addEventListener('input', ()=>{
    if (audio.duration){ audio.currentTime = (seek.value/100) * audio.duration; }
  });
  volume.addEventListener('input', ()=>{
    audio.volume = volume.value/100;
    volume.style.background = `linear-gradient(to right, var(--accent) ${volume.value}%, var(--track) ${volume.value}%)`;
  });
  audio.volume = 0.7;

  shuffleBtn.addEventListener('click', ()=>{
    shuffle = !shuffle;
    shuffleBtn.classList.toggle('active', shuffle);
  });
  autoplayBtn.addEventListener('click', ()=>{
    autoplay = !autoplay;
    autoplayBtn.classList.toggle('active', autoplay);
  });
  repeatBtn.addEventListener('click', ()=>{
    repeat = !repeat;
    repeatBtn.classList.toggle('active', repeat);
  });

  // preload durations for playlist display
  tracks.forEach((t, i)=>{
    const a = new Audio();
    a.preload = 'metadata';
    a.src = t.src;
    a.addEventListener('loadedmetadata', ()=>{
      const el = document.querySelector(`[data-dur="${i}"]`);
      if (el) el.textContent = fmt(a.duration);
    });
  });

  renderPlaylist();
  loadTrack(0, false);
})();
</script>

</body>
</html>
